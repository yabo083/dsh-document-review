name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      reason:
        description: '手动触发原因'
        required: false
        default: 'Manual build/fix'

# Trusted publishing: npm exchanges the GitHub OIDC token for a publish
# credential, so no NPM_TOKEN secret and no manual 2FA is needed. The npm
# account must list this repository as a trusted publisher.
permissions:
  id-token: write
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Update npm
        run: npm install -g npm@latest

      - name: Install
        run: npm install

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build

      - name: Verify package completeness
        run: npm run verify-pack

      - name: Pack
        run: npm pack

      - name: Publish to npm
        run: npm publish --access public

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: "*.tgz"
